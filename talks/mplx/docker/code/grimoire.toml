# Grimoire book configuration for Shelf's handbook, served by the app
# under /static/handbook/.

[book]
title = "Shelf handbook"
description = "How to use and run Shelf, the book club reading list"
language = "en"
src = "docs"

[build]
out = "site"
clean = true

[html]
theme = "carbon"
mode = "auto"

[search]
enabled = false

[pdf]
enabled = false
