global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: shop
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:9091"]
  - job_name: statsd
    static_configs:
      - targets: ["127.0.0.1:9102"]
