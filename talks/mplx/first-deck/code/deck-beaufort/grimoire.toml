# Grimoire book configuration for the @mplx/beaufort documentation.

[book]
title = "@mplx/beaufort"
description = "Wind speed to Beaufort force"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://mplx.github.io/deck-beaufort/"
repoUrl = "https://github.com/mplx/deck-beaufort"
repoLabel = "Source"
editUrl = "https://github.com/mplx/deck-beaufort/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
