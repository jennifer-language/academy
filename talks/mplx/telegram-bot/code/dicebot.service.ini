# Install as /etc/systemd/system/dicebot.service, with the bot in
# /opt/dicebot (bot.j, jennifer-logo.png, vendor/ from jvc install) and
# TELEGRAM_BOT_TOKEN=... in /etc/dicebot.env (mode 0600, owned by root).
[Unit]
Description=Jennifer dice bot for Telegram
After=network-online.target
Wants=network-online.target

[Service]
ExecStart=/usr/bin/jennifer run /opt/dicebot/bot.j
WorkingDirectory=/opt/dicebot
EnvironmentFile=/etc/dicebot.env
DynamicUser=yes
Restart=on-failure

[Install]
WantedBy=multi-user.target
